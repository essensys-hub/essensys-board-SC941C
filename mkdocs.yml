site_name: Documentation SC941C
site_description: Documentation technique du module SC941C pour Essensys Atrium.
site_author: Essensys Atrium

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

nav:
  - Accueil: index.md
  - 🏛️ Architecture: architecture.md
  - 🔌 Hardware: 
    - Spécifications: hardware.md
    - Schémas: schematics.md
    - Retouche foudre: retouche-foudre.md
  - 💻 Firmware: firmware.md
  - 💾 Téléchargements: downloads.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
